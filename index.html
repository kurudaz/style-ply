<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DGS 刷線 Viewer (Spark)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #fff; touch-action: none; }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }

        /* 頂部：檔案選擇 */
        #top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; gap: 8px;
        }
        .file-btn {
            flex: 1;
            background: #4CAF50;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .file-btn:active { background: #3d8b40; }

        /* 狀態列 */
        #status {
            position: fixed;
            top: 64px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            max-height: 25vh;
            overflow-y: auto;
            z-index: 10;
        }
        #status .ok  { color: #4CAF50; }
        #status .err { color: #ff5252; }
        #status .info{ color: #64b5f6; }
        #status .warn{ color: #ffb74d; }

        /* 底部控制面板 */
        #panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(20,20,20,0.9);
            border-top: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            transition: transform 0.3s;
        }
        #panel.collapsed { transform: translateY(calc(100% - 50px)); }
        #panel-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #panel-header h2 { margin: 0; font-size: 1rem; color: #4CAF50; }
        #toggle-icon { transition: transform 0.3s; }
        #panel.collapsed #toggle-icon { transform: rotate(180deg); }
        #panel-body { padding: 12px 16px 20px; max-height: 60vh; overflow-y: auto; }

        .row { margin-top: 12px; }
        .row label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; margin-bottom: 6px;
        }
        .row label .val { color: #4CAF50; font-family: ui-monospace, Menlo, monospace; }
        input[type="range"] { width: 100%; height: 24px; accent-color: #4CAF50; margin: 0; }
        select {
            width: 100%; padding: 10px;
            background: #222; color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn {
            display: block; width: 100%;
            padding: 12px;
            background: #333; color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn.primary { background: #4CAF50; border-color: #4CAF50; }
        .btn:disabled { opacity: 0.4; }
        .section-title {
            font-size: 0.75rem; color: #888;
            margin: 16px 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="top-bar">
        <button class="file-btn" id="file-btn-trigger" type="button">
            📁 選擇 .ply / .splat 檔案
        </button>
        <input type="file" id="ply-upload" accept=".ply,.splat" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
    </div>

    <div id="status"><div class="info">等待選擇檔案...</div></div>

    <div id="panel" class="collapsed">
        <div id="panel-header">
            <h2>🎨 刷線控制</h2>
            <span id="toggle-icon">▼</span>
        </div>
        <div id="panel-body">

            <div class="section-title">對齊軸向</div>
            <select id="align-axis">
                <option value="x">X 軸（橫向）</option>
                <option value="y">Y 軸（直向）</option>
                <option value="z" selected>Z 軸（深度）</option>
            </select>

            <div class="section-title">形狀</div>
            <div class="row">
                <label><span>長度</span><span class="val" id="val-len">0.05</span></label>
                <input type="range" id="len" min="0.005" max="0.5" step="0.005" value="0.05">
            </div>
            <div class="row">
                <label><span>粗細</span><span class="val" id="val-thick">0.003</span></label>
                <input type="range" id="thick" min="0.0005" max="0.05" step="0.0005" value="0.003">
            </div>

            <button id="apply" class="btn primary" disabled>套用刷線</button>
            <button id="reset" class="btn" disabled>還原原始</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

        // -------- log --------
        const statusEl = document.getElementById('status');
        function log(msg, cls = '') {
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            statusEl.appendChild(line);
            statusEl.scrollTop = statusEl.scrollHeight;
            console.log(msg);
        }

        log(`THREE.js: r${THREE.REVISION}`, 'info');
        log(`Spark: ${typeof SplatMesh === 'function' ? 'OK' : 'FAIL'}`,
            typeof SplatMesh === 'function' ? 'ok' : 'err');

        // -------- 場景 --------
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        canvasContainer.appendChild(renderer.domElement);

        const spark = new SparkRenderer({ renderer });
        scene.add(spark);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        renderer.setAnimationLoop(() => {
            controls.update();
            renderer.render(scene, camera);
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        log('場景就緒', 'ok');

        // -------- 檔案選擇按鈕橋接（避開 iOS Safari label 雙觸發 bug） --------
        const fileInput = document.getElementById('ply-upload');
        document.getElementById('file-btn-trigger').addEventListener('click', () => {
            // 重置 value，這樣連續選同一個檔案也會觸發 change
            fileInput.value = '';
            fileInput.click();
        });

        // -------- 狀態管理 --------
        let currentMesh = null;
        // 備份原始 packed array bytes，這樣才能還原
        let originalPackedArray = null;
        let originalNumSplats = 0;

        // -------- UI 收合 --------
        const panel = document.getElementById('panel');
        document.getElementById('panel-header').addEventListener('click', () => {
            panel.classList.toggle('collapsed');
        });

        // -------- 檔案載入 --------
        document.getElementById('ply-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            log(`選到: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, 'info');

            // 清掉舊的
            if (currentMesh) {
                scene.remove(currentMesh);
                try { currentMesh.dispose?.(); } catch {}
                currentMesh = null;
                originalPackedArray = null;
            }

            try {
                const buf = await file.arrayBuffer();
                log(`讀檔完成 (${buf.byteLength} bytes)，建立 SplatMesh...`, 'info');

                const mesh = new SplatMesh({
                    fileBytes: buf,
                    onLoad: (m) => {
                        const n = m.packedSplats?.numSplats ?? m.numSplats ?? 0;
                        log(`onLoad ✓  splat 數量: ${n}`, 'ok');

                        // 備份原始資料（packedArray 是 Uint32Array，每 splat 4 個 uint32 = 16 bytes）
                        if (m.packedSplats?.packedArray) {
                            originalNumSplats = n;
                            originalPackedArray = new Uint32Array(
                                m.packedSplats.packedArray.buffer.slice(0, n * 16)
                            );
                            log(`備份 ${(originalPackedArray.byteLength/1024/1024).toFixed(2)} MB`, 'info');
                        } else {
                            log('警告: 找不到 packedSplats.packedArray', 'warn');
                        }

                        // 對焦
                        try {
                            const box = new THREE.Box3().setFromObject(m);
                            if (!box.isEmpty()) {
                                const center = box.getCenter(new THREE.Vector3());
                                const size = box.getSize(new THREE.Vector3()).length();
                                controls.target.copy(center);
                                camera.position.copy(center).add(new THREE.Vector3(0, 0, Math.max(size * 1.2, 1)));
                                controls.update();
                                log(`對焦完成 (size=${size.toFixed(2)})`, 'ok');
                            }
                        } catch (err) {
                            log('對焦失敗（可忽略）: ' + err.message, 'warn');
                        }

                        document.getElementById('apply').disabled = false;
                        document.getElementById('reset').disabled = false;
                    },
                    onProgress: (ev) => {
                        if (ev.lengthComputable) {
                            log(`  下載 ${(ev.loaded/ev.total*100).toFixed(0)}%`, 'info');
                        }
                    }
                });

                // INRIA PLY 通常是 OpenCV 座標 → 翻轉
                mesh.quaternion.set(1, 0, 0, 0);

                scene.add(mesh);
                currentMesh = mesh;
                log('已加入場景，等待 onLoad...', 'ok');

            } catch (err) {
                log('載入失敗: ' + err.message, 'err');
                console.error(err);
            }
        });

        // -------- 刷線：用 forEachSplat + setSplat --------
        function applyBrushStroke() {
            if (!currentMesh || !currentMesh.packedSplats) {
                log('沒有可處理的 mesh', 'err');
                return;
            }

            const axis = document.getElementById('align-axis').value;
            const length = parseFloat(document.getElementById('len').value);
            const thickness = parseFloat(document.getElementById('thick').value);

            // 計算對齊用 quaternion：把 splat 的 local X (長軸) 旋轉對齊到指定世界軸
            // X 軸：identity (0,0,0,1)
            // Y 軸：繞 Z 轉 90°
            // Z 軸：繞 Y 轉 -90°
            let qx, qy, qz, qw;
            if (axis === 'x') {
                qx = 0; qy = 0; qz = 0; qw = 1;
            } else if (axis === 'y') {
                qx = 0; qy = 0; qz = Math.SQRT1_2; qw = Math.SQRT1_2;
            } else { // z
                qx = 0; qy = -Math.SQRT1_2; qz = 0; qw = Math.SQRT1_2;
            }

            const targetQuat = new THREE.Quaternion(qx, qy, qz, qw);
            const targetScales = new THREE.Vector3(length, thickness, thickness);

            log(`套用刷線：axis=${axis}, len=${length}, thick=${thickness}`, 'info');

            const ps = currentMesh.packedSplats;
            const n = ps.numSplats;
            const t0 = performance.now();

            try {
                ps.forEachSplat((index, center, scales, quaternion, opacity, color) => {
                    // 保留 center, opacity, color；換掉 quaternion 和 scales
                    ps.setSplat(index, center, targetScales, targetQuat, opacity, color);
                });

                ps.needsUpdate = true;
                // 通知 SplatMesh 重新處理
                if (typeof currentMesh.updateGenerator === 'function') {
                    currentMesh.updateGenerator();
                }

                const t1 = performance.now();
                log(`完成 ${n} 個 splat (${(t1-t0).toFixed(0)} ms)`, 'ok');
            } catch (err) {
                log('套用失敗: ' + err.message, 'err');
                console.error(err);
            }
        }

        function resetBrushStroke() {
            if (!currentMesh || !currentMesh.packedSplats || !originalPackedArray) {
                log('沒有原始備份可還原', 'err');
                return;
            }
            try {
                const ps = currentMesh.packedSplats;
                // 直接把備份的 uint32 寫回
                ps.packedArray.set(originalPackedArray, 0);
                ps.numSplats = originalNumSplats;
                ps.needsUpdate = true;
                if (typeof currentMesh.updateGenerator === 'function') {
                    currentMesh.updateGenerator();
                }
                log(`還原 ${originalNumSplats} 個 splat ✓`, 'ok');
            } catch (err) {
                log('還原失敗: ' + err.message, 'err');
                console.error(err);
            }
        }

        document.getElementById('apply').addEventListener('click', applyBrushStroke);
        document.getElementById('reset').addEventListener('click', resetBrushStroke);

        // -------- slider 顯示值 --------
        const lenEl = document.getElementById('len');
        const thickEl = document.getElementById('thick');
        lenEl.addEventListener('input', e => {
            document.getElementById('val-len').textContent = parseFloat(e.target.value).toFixed(3);
        });
        thickEl.addEventListener('input', e => {
            document.getElementById('val-thick').textContent = parseFloat(e.target.value).toFixed(4);
        });

        // -------- 全域錯誤捕捉 --------
        window.addEventListener('error', (e) => {
            log('error: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno, 'err');
        });
        window.addEventListener('unhandledrejection', (e) => {
            log('rejection: ' + (e.reason?.message || e.reason), 'err');
        });
    </script>
</body>
</html>
