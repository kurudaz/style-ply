<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3DGS 刷線 Viewer (Spark)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #fff; touch-action: none; }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }

        #top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; gap: 8px;
            align-items: stretch;
        }
        .file-btn {
            flex: 1;
            background: #4CAF50;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .file-btn:active { background: #3d8b40; }
        .icon-btn {
            width: 48px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:active { background: rgba(255,255,255,0.25); }
        .icon-btn.active { background: #4CAF50; border-color: #4CAF50; }

        #status-wrap {
            position: fixed;
            top: 64px; left: 10px; right: 10px;
            z-index: 10;
            transition: max-height 0.25s, opacity 0.25s;
            max-height: 30vh;
            overflow: hidden;
        }
        #status-wrap.collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }
        #status {
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            max-height: 30vh;
            overflow-y: auto;
        }
        #status .ok  { color: #4CAF50; }
        #status .err { color: #ff5252; }
        #status .info{ color: #64b5f6; }
        #status .warn{ color: #ffb74d; }

        #panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(20,20,20,0.92);
            border-top: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            transition: transform 0.3s;
        }
        #panel.collapsed { transform: translateY(calc(100% - 50px)); }
        #panel-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #panel-header h2 { margin: 0; font-size: 1rem; color: #4CAF50; }
        #toggle-icon { transition: transform 0.3s; }
        #panel.collapsed #toggle-icon { transform: rotate(180deg); }
        #panel-body { padding: 12px 16px 20px; max-height: 60vh; overflow-y: auto; }

        .row { margin-top: 12px; }
        .row label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; margin-bottom: 6px;
        }
        .row label .val { color: #4CAF50; font-family: ui-monospace, Menlo, monospace; }
        input[type="range"] { width: 100%; height: 24px; accent-color: #4CAF50; margin: 0; }
        input[type="number"] {
            width: 100%; padding: 10px 12px;
            background: #222; color: #4CAF50;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 1rem;
            font-family: ui-monospace, Menlo, monospace;
            font-weight: bold;
            box-sizing: border-box;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        select {
            width: 100%; padding: 10px;
            background: #222; color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn {
            display: block; width: 100%;
            padding: 12px;
            background: #333; color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn.primary { background: #4CAF50; border-color: #4CAF50; }
        .btn:disabled { opacity: 0.4; }
        .section-title {
            font-size: 0.75rem; color: #888;
            margin: 16px 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .hint {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
            line-height: 1.4;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="top-bar">
        <button class="file-btn" id="file-btn-trigger" type="button">
            📁 選擇 .ply 檔案
        </button>
        <button class="icon-btn" id="log-toggle" type="button" title="顯示/隱藏 log">📋</button>
        <input type="file" id="ply-upload" accept=".ply,.splat" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
    </div>

    <div id="status-wrap" class="collapsed">
        <div id="status"></div>
    </div>

    <div id="panel" class="collapsed">
        <div id="panel-header">
            <h2>🎨 刷線控制</h2>
            <span id="toggle-icon">▼</span>
        </div>
        <div id="panel-body">

            <div class="section-title">對齊軸向</div>
            <select id="align-axis">
                <option value="x">X 軸（橫向）</option>
                <option value="y">Y 軸（直向）</option>
                <option value="z" selected>Z 軸（深度）</option>
            </select>
            <div class="hint">所有 splat 的長軸都對齊到此世界軸</div>

            <div class="section-title">形狀</div>
            <div class="row">
                <label><span>長度（長軸）</span></label>
                <input type="number" id="len" value="1.0" step="any" min="0">
            </div>
            <div class="row">
                <label><span>粗細（短軸）</span></label>
                <input type="number" id="thick" value="0.01" step="any" min="0">
            </div>
            <div class="hint">直接寫入 PLY 的 scale_0/1/2，可任意填數字。範例：長度 1.0 / 粗細 0.01 = 100:1 比例</div>

            <button id="apply" class="btn primary" disabled>套用刷線（重新載入）</button>
            <button id="reset" class="btn" disabled>還原原始</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

        // -------- log --------
        const statusEl = document.getElementById('status');
        const statusWrap = document.getElementById('status-wrap');
        function log(msg, cls = '') {
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            statusEl.appendChild(line);
            statusEl.scrollTop = statusEl.scrollHeight;
            console.log(msg);
        }
        const logToggle = document.getElementById('log-toggle');
        logToggle.addEventListener('click', () => {
            statusWrap.classList.toggle('collapsed');
            logToggle.classList.toggle('active', !statusWrap.classList.contains('collapsed'));
        });

        log(`THREE.js: r${THREE.REVISION}`, 'info');
        log(`Spark: ${typeof SplatMesh === 'function' ? 'OK' : 'FAIL'}`,
            typeof SplatMesh === 'function' ? 'ok' : 'err');

        // -------- 場景 --------
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        canvasContainer.appendChild(renderer.domElement);

        const spark = new SparkRenderer({ renderer });
        scene.add(spark);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        renderer.setAnimationLoop(() => {
            controls.update();
            renderer.render(scene, camera);
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        log('場景就緒', 'ok');

        // -------- 狀態 --------
        let originalPlyBuffer = null;
        let currentMesh = null;

        // -------- 檔案按鈕橋接 --------
        const fileInput = document.getElementById('ply-upload');
        document.getElementById('file-btn-trigger').addEventListener('click', () => {
            fileInput.value = '';
            fileInput.click();
        });

        // -------- UI 收合 --------
        const panel = document.getElementById('panel');
        document.getElementById('panel-header').addEventListener('click', () => {
            panel.classList.toggle('collapsed');
        });

        // -------- PLY parser --------
        function parsePlyHeader(buffer) {
            const decoder = new TextDecoder('utf-8');
            const probe = decoder.decode(new Uint8Array(buffer, 0, Math.min(16384, buffer.byteLength)));
            const endIdx = probe.indexOf('end_header\n');
            if (endIdx < 0) throw new Error('找不到 end_header');
            const headerStr = probe.substring(0, endIdx);
            const headerByteLen = endIdx + 'end_header\n'.length;

            const lines = headerStr.split('\n');
            let format = null;
            let vertexCount = 0;
            const props = [];
            let inVertex = false;

            for (const line of lines) {
                if (line.startsWith('format ')) format = line.split(' ')[1];
                else if (line.startsWith('element vertex ')) {
                    vertexCount = parseInt(line.split(' ')[2]);
                    inVertex = true;
                } else if (line.startsWith('element ')) {
                    inVertex = false;
                } else if (inVertex && line.startsWith('property ')) {
                    const parts = line.split(' ');
                    props.push({ type: parts[1], name: parts[2] });
                }
            }
            if (format !== 'binary_little_endian') {
                throw new Error('只支援 binary_little_endian PLY，目前是 ' + format);
            }

            const typeSize = { float:4, double:8, int:4, uint:4, short:2, ushort:2, uchar:1, char:1 };
            let offset = 0;
            const propMap = {};
            for (const p of props) {
                const sz = typeSize[p.type];
                if (sz === undefined) throw new Error('未知 type: ' + p.type);
                propMap[p.name] = { offset, type: p.type, size: sz };
                offset += sz;
            }
            return { headerByteLen, vertexCount, propMap, stride: offset };
        }

        // -------- 改寫 PLY --------
        function rewritePly(buffer, axis, length, thickness) {
            const { headerByteLen, vertexCount, propMap, stride } = parsePlyHeader(buffer);
            const required = ['rot_0','rot_1','rot_2','rot_3','scale_0','scale_1','scale_2'];
            for (const r of required) {
                if (!propMap[r]) throw new Error(`PLY 缺少 ${r}`);
            }

            const newBuf = buffer.slice(0);
            const dv = new DataView(newBuf);

            // INRIA quaternion: rot_0=w, rot_1=x, rot_2=y, rot_3=z
            // 旋轉 θ 的 quaternion = (cos(θ/2), axis*sin(θ/2))
            let qw, qx, qy, qz;
            if (axis === 'x') {
                qw = 1; qx = 0; qy = 0; qz = 0;
            } else if (axis === 'y') {
                qw = Math.SQRT1_2; qx = 0; qy = 0; qz = Math.SQRT1_2;  // 繞 Z 轉 +90°
            } else {
                qw = Math.SQRT1_2; qx = 0; qy = -Math.SQRT1_2; qz = 0; // 繞 Y 轉 -90°
            }

            const sLong = Math.log(length);
            const sShort = Math.log(thickness);

            const r0 = propMap.rot_0.offset;
            const r1 = propMap.rot_1.offset;
            const r2 = propMap.rot_2.offset;
            const r3 = propMap.rot_3.offset;
            const s0 = propMap.scale_0.offset;
            const s1 = propMap.scale_1.offset;
            const s2 = propMap.scale_2.offset;

            for (let i = 0; i < vertexCount; i++) {
                const base = headerByteLen + i * stride;
                dv.setFloat32(base + r0, qw, true);
                dv.setFloat32(base + r1, qx, true);
                dv.setFloat32(base + r2, qy, true);
                dv.setFloat32(base + r3, qz, true);
                dv.setFloat32(base + s0, sLong, true);
                dv.setFloat32(base + s1, sShort, true);
                dv.setFloat32(base + s2, sShort, true);
            }
            return newBuf;
        }

        // -------- 載入 buffer --------
        async function loadBufferIntoScene(buffer, isFirstLoad = false) {
            if (currentMesh) {
                scene.remove(currentMesh);
                try { currentMesh.dispose?.(); } catch {}
                currentMesh = null;
            }

            return new Promise((resolve) => {
                const mesh = new SplatMesh({
                    fileBytes: buffer,
                    onLoad: (m) => {
                        const n = m.packedSplats?.numSplats ?? 0;
                        log(`onLoad ✓  splat: ${n}`, 'ok');

                        if (isFirstLoad) {
                            try {
                                const box = new THREE.Box3().setFromObject(m);
                                if (!box.isEmpty()) {
                                    const center = box.getCenter(new THREE.Vector3());
                                    const size = box.getSize(new THREE.Vector3()).length();
                                    controls.target.copy(center);
                                    camera.position.copy(center).add(new THREE.Vector3(0, 0, Math.max(size * 1.2, 1)));
                                    controls.update();
                                    log(`對焦完成 (size=${size.toFixed(2)})`, 'ok');
                                }
                            } catch (err) {
                                log('對焦失敗: ' + err.message, 'warn');
                            }
                        }
                        resolve(m);
                    }
                });

                mesh.quaternion.set(1, 0, 0, 0);
                scene.add(mesh);
                currentMesh = mesh;
            });
        }

        // -------- 檔案選擇 --------
        document.getElementById('ply-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            log(`選到: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, 'info');

            try {
                const buf = await file.arrayBuffer();
                originalPlyBuffer = buf;
                log(`讀檔完成 (${buf.byteLength} bytes)`, 'ok');

                try {
                    const info = parsePlyHeader(buf);
                    log(`PLY: ${info.vertexCount} vertices, stride=${info.stride}`, 'info');
                    const hasGS = ['rot_0','scale_0'].every(k => info.propMap[k]);
                    log(`3DGS 屬性: ${hasGS ? '✓' : '✗ 不是 3DGS PLY'}`, hasGS ? 'ok' : 'err');
                } catch (err) {
                    log('header 解析失敗: ' + err.message, 'warn');
                }

                await loadBufferIntoScene(buf, true);

                document.getElementById('apply').disabled = false;
                document.getElementById('reset').disabled = false;

            } catch (err) {
                log('載入失敗: ' + err.message, 'err');
                console.error(err);
            }
        });

        // -------- 套用 --------
        async function applyBrushStroke() {
            if (!originalPlyBuffer) { log('沒有原始 PLY', 'err'); return; }

            const axis = document.getElementById('align-axis').value;
            const length = parseFloat(document.getElementById('len').value);
            const thickness = parseFloat(document.getElementById('thick').value);

            log(`改寫 PLY: axis=${axis}, len=${length}, thick=${thickness}`, 'info');
            const t0 = performance.now();
            try {
                const newBuf = rewritePly(originalPlyBuffer, axis, length, thickness);
                const t1 = performance.now();
                log(`改寫完成 (${(t1-t0).toFixed(0)} ms)，重新載入...`, 'ok');
                await loadBufferIntoScene(newBuf, false);
                const t2 = performance.now();
                log(`完成 (總計 ${(t2-t0).toFixed(0)} ms)`, 'ok');
            } catch (err) {
                log('套用失敗: ' + err.message, 'err');
                console.error(err);
            }
        }

        async function resetBrushStroke() {
            if (!originalPlyBuffer) { log('沒有原始 PLY', 'err'); return; }
            log('還原原始...', 'info');
            try {
                await loadBufferIntoScene(originalPlyBuffer, false);
                log('還原完成 ✓', 'ok');
            } catch (err) {
                log('還原失敗: ' + err.message, 'err');
            }
        }

        document.getElementById('apply').addEventListener('click', applyBrushStroke);
        document.getElementById('reset').addEventListener('click', resetBrushStroke);

        window.addEventListener('error', (e) => {
            log('error: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno, 'err');
        });
        window.addEventListener('unhandledrejection', (e) => {
            log('rejection: ' + (e.reason?.message || e.reason), 'err');
        });
    </script>
</body>
</html>
